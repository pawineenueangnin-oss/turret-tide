<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#14260f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Turret Tide" />
<meta name="application-name" content="Turret Tide" />
<meta name="description" content="Turret Tide: Zombie Defense. Lead your hero down the road, collect coins and build a base that fights back." />
<title>Turret Tide: Zombie Defense</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234aa646'/%3E%3Ccircle cx='32' cy='40' r='16' fill='%23677079' stroke='%23222' stroke-width='3'/%3E%3Crect x='28' y='8' width='8' height='28' rx='2' fill='%23333'/%3E%3Ccircle cx='32' cy='40' r='8' fill='%23ffb21f'/%3E%3C/svg%3E" />
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#14260f;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;color:#fff;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
#app{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;max-width:520px;overflow:hidden;background:#3f9a3a;--ad-h:0px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hid{visibility:hidden !important;pointer-events:none !important}
#hud{position:absolute;left:0;right:0;top:0;z-index:3;padding:max(8px,env(safe-area-inset-top)) 10px 14px;display:flex;flex-direction:column;gap:6px;pointer-events:none;
  background:linear-gradient(rgba(8,22,10,.82),rgba(8,22,10,.55) 70%,rgba(8,22,10,0))}
#hud .row{display:flex;align-items:center;gap:8px}
.ibtn{pointer-events:auto;flex:none;width:44px;height:44px;border-radius:14px;border:2px solid rgba(255,255,255,.28);background:rgba(18,38,20,.85);color:#fff;font-weight:900;font-size:16px;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.ibtn:active{transform:translateY(2px)}
.ibtn svg{width:22px;height:22px}
.lvbox{flex:1;min-width:0}
.lvtxt{font-weight:900;font-size:15px;text-shadow:0 2px 0 rgba(0,0,0,.55);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;gap:6px}
.lvtxt span:last-child{color:#ffe27a}
.bar{height:9px;border-radius:6px;background:rgba(0,0,0,.5);overflow:hidden;border:1px solid rgba(255,255,255,.22);margin-top:3px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff8a1f);border-radius:6px;transition:width .2s}
.coinpill{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.55);border:2px solid #ffd23f;border-radius:22px;padding:5px 12px 5px 6px;font-weight:900;font-size:17px;min-width:86px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.coinpill.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.12)}}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff7b8,#ffd23f 45%,#e39b00);box-shadow:inset 0 0 0 2px #b97800;flex:none;position:relative}
.coin::after{content:"";position:absolute;left:32%;top:24%;width:36%;height:52%;border-radius:40%;border:2px solid rgba(160,95,0,.55)}
.hp{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.hp .bar{flex:1;height:15px;margin:0;border-radius:8px}
.hp .bar>i{background:linear-gradient(90deg,#2fd35c,#a6ff4d)}
.hp.low .bar>i{background:linear-gradient(90deg,#ff3b3b,#ff9a3b);animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.55}}
.hp b{font-size:13px;min-width:64px;text-align:right;text-shadow:0 2px 0 rgba(0,0,0,.6)}
.heart{width:20px;height:20px;flex:none}
#panel{position:absolute;left:0;right:0;bottom:var(--ad-h);z-index:3;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:9px 8px max(9px,env(safe-area-inset-bottom));
  background:linear-gradient(#263a22,#121d10);border-top:3px solid #0a1208;box-shadow:0 -4px 10px rgba(0,0,0,.25)}
.upg{position:relative;height:94px;border-radius:16px;border:none;background:linear-gradient(#55673f,#33422a);box-shadow:0 4px 0 #18220f,inset 0 2px 0 rgba(255,255,255,.18);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px;transition:filter .15s}
.upg .ic{height:30px;display:grid;place-items:center}
.upg .ic svg{width:30px;height:30px}
.upg .nm{font-size:12px;font-weight:800;line-height:1.1;text-align:center;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 2px}
.upg .lv{font-size:10.5px;opacity:.85;font-weight:700}
.upg .cost{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:900;background:rgba(0,0,0,.4);border-radius:10px;padding:2px 7px;margin-top:2px}
.upg .cost .coin{width:13px;height:13px}
.upg .cost .coin::after{display:none}
.upg.ok{background:linear-gradient(#79c83f,#3f8a22);box-shadow:0 4px 0 #22521a,inset 0 2px 0 rgba(255,255,255,.35),0 0 0 2px #ffe066}
.upg.ok .cost{background:rgba(0,0,0,.3);color:#fff6b0}
.upg.no{filter:saturate(.35) brightness(.78)}
.upg.max .cost{color:#9ff}
.upg:active{transform:translateY(3px);box-shadow:0 1px 0 #18220f}
.upg.deny{animation:deny .3s}
@keyframes deny{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#ad-slot{position:absolute;left:0;right:0;bottom:0;height:var(--ad-h);z-index:3;background:#0b140a}
#title{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;pointer-events:none;
  padding:max(14px,env(safe-area-inset-top)) 16px 0;background:linear-gradient(rgba(6,16,8,.7),rgba(6,16,8,.15) 38%,rgba(6,16,8,0) 55%,rgba(6,16,8,.35))}
#title > *{pointer-events:auto}
#logo{width:100%;max-width:440px;height:clamp(150px,27vh,230px);display:block}
.sub:lang(th){letter-spacing:0;text-transform:none;font-size:18px}
.sub{margin-top:-4px;font-weight:900;font-size:16px;letter-spacing:3px;color:#e9ffd6;text-shadow:0 2px 0 #0a1f08,0 0 12px rgba(0,0,0,.6);text-transform:uppercase}
.tgear{position:absolute;top:max(10px,env(safe-area-inset-top));right:10px}
.tbot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:360px}
.info{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.chip{background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.25);border-radius:18px;padding:6px 12px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
.btn{border:none;border-radius:20px;font-weight:900;font-size:20px;padding:14px 22px;color:#4a2500;background:linear-gradient(#ffe878,#ffb21f);
  box-shadow:0 6px 0 #b46a00,inset 0 2px 0 rgba(255,255,255,.7);text-shadow:0 1px 0 rgba(255,255,255,.5);min-height:56px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b46a00}
.btn.big{font-size:30px;width:100%;min-height:76px;letter-spacing:1px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.btn.big small{display:block;font-size:14px;letter-spacing:0;opacity:.8}
.btn.green{color:#fff;background:linear-gradient(#7ad94a,#3a9a28);box-shadow:0 6px 0 #1f5c14,inset 0 2px 0 rgba(255,255,255,.45);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn.green:active{box-shadow:0 2px 0 #1f5c14}
.btn.gray{color:#fff;background:linear-gradient(#61707a,#3c464d);box-shadow:0 6px 0 #222a2f,inset 0 2px 0 rgba(255,255,255,.3);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn.gray:active{box-shadow:0 2px 0 #222a2f}
.btn.purple{color:#fff;background:linear-gradient(#b07cff,#6a3ad6);box-shadow:0 6px 0 #3c1f86,inset 0 2px 0 rgba(255,255,255,.35);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn.purple:active{box-shadow:0 2px 0 #3c1f86}
.btn.purple small{display:block;font-size:12px;opacity:.85;font-weight:700}
.brow{display:flex;gap:10px;width:100%}
.brow .btn{flex:1}
.ov{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:rgba(4,12,5,.72);
  padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));overflow:auto}
.ov.on{display:flex}
.card{width:100%;max-width:380px;margin:auto;background:linear-gradient(#2f4a2a,#1b2c18);border:3px solid #6fae4a;border-radius:24px;padding:18px 16px 18px;
  box-shadow:0 10px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.15);display:flex;flex-direction:column;gap:12px;animation:pop .28s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.card h2{text-align:center;font-size:28px;font-weight:900;color:#ffe066;text-shadow:0 3px 0 #3a2a00;line-height:1.15}
.card h2.red{color:#ff6b5b;text-shadow:0 3px 0 #4a0a00}
.card p{text-align:center;font-size:15px;opacity:.92;line-height:1.4}
.card .btn{width:100%}
.stat{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.3);border-radius:14px;padding:10px 14px;font-weight:800;font-size:16px}
.stat b{display:flex;align-items:center;gap:6px;font-size:20px;color:#ffe066}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(0,0,0,.28);border-radius:14px;padding:10px 12px;font-weight:800;font-size:15px}
.seg{display:flex;gap:6px}
.seg button{border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.3);color:#fff;border-radius:12px;padding:9px 13px;font-weight:800;font-size:15px;min-height:44px}
.seg button.sel{background:#ffd23f;color:#3a2200;border-color:#fff3b0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:8px;background:linear-gradient(90deg,#ffd23f var(--p,50%),rgba(0,0,0,.45) var(--p,50%));outline:none;margin:12px 0 6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid #ffb21f;box-shadow:0 2px 4px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #ffb21f}
.vol{flex-direction:column;align-items:stretch}
.vol .lab{display:flex;justify-content:space-between}
.howto{font-size:14px;line-height:1.45;background:rgba(0,0,0,.25);border-radius:14px;padding:10px 12px 10px 28px;font-weight:600}
.howto li{margin:2px 0}
.ver{text-align:center;font-size:11px;opacity:.5}
.arm-row{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.3);border-radius:16px;padding:10px}
.arm-row .ic{width:44px;height:44px;flex:none;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center}
.arm-row .ic svg{width:32px;height:32px}
.arm-row .tx{flex:1;min-width:0}
.arm-row .tx b{display:block;font-size:16px}
.arm-row .tx span{display:block;font-size:12.5px;opacity:.8;line-height:1.3}
.arm-row .tx em{display:block;font-style:normal;font-size:12.5px;color:#9fe86a;font-weight:800}
.arm-row button{flex:none;min-width:86px;min-height:48px;border:none;border-radius:14px;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;gap:5px;
  background:linear-gradient(#79c83f,#3f8a22);color:#fff;box-shadow:0 4px 0 #22521a}
.arm-row button.no{filter:saturate(.3) brightness(.75)}
.arm-row button:active{transform:translateY(3px);box-shadow:0 1px 0 #22521a}
.arm-head{display:flex;justify-content:space-between;align-items:center}
.arm-head h2{text-align:left}
#banner{position:absolute;left:0;right:0;top:34%;z-index:5;text-align:center;font-weight:900;font-size:42px;letter-spacing:1px;pointer-events:none;opacity:0;
  color:#ffe066;-webkit-text-stroke:2px #3a1d00;text-shadow:0 4px 0 #3a1d00,0 0 18px rgba(0,0,0,.5);padding:0 10px;line-height:1.1}
#banner.small{font-size:30px;color:#fff}
#banner.boss{color:#ff5b4a;-webkit-text-stroke:2px #3a0500;text-shadow:0 4px 0 #3a0500,0 0 22px rgba(255,40,0,.6)}
#banner.show{animation:bn 1.9s ease-out forwards}
@keyframes bn{0%{opacity:0;transform:scale(.5)}12%{opacity:1;transform:scale(1.1)}22%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#hint{position:absolute;left:50%;z-index:4;transform:translateX(-50%);background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.35);border-radius:16px;padding:8px 14px;font-weight:800;font-size:14px;
  white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .4s}
#hint.on{opacity:1}
#toast{position:absolute;left:50%;top:22%;z-index:9;transform:translateX(-50%);background:rgba(0,0,0,.75);border-radius:14px;padding:8px 14px;font-weight:800;font-size:15px;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
#toast.on{opacity:1}

/* ===== v2 additions ===== */
#hud .row.c{justify-content:center}
.corebar{display:flex;align-items:center;gap:6px;margin-top:4px}
.corebar .bar{flex:1;height:13px;margin:0;border-radius:8px}
.corebar .bar>i{background:linear-gradient(90deg,#3fb6ff,#8ef0ff)}
.corebar.low .bar>i{background:linear-gradient(90deg,#ff3b3b,#ff9a3b);animation:blink .5s infinite alternate}
.corebar b{font-size:12px;min-width:58px;text-align:right;text-shadow:0 2px 0 rgba(0,0,0,.6)}
.corebar svg{width:18px;height:18px;flex:none}
.pill{background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.25);border-radius:16px;padding:4px 12px;font-weight:800;font-size:13.5px;white-space:nowrap}
.pill.red{background:rgba(150,10,10,.75);border-color:#ff8a7a;animation:blink .6s infinite alternate}
.pill:empty{display:none}
#tip{position:absolute;left:50%;z-index:4;transform:translateX(-50%);max-width:92%;background:rgba(10,20,10,.78);border:2px solid #ffe066;border-radius:16px;padding:8px 14px;
  font-weight:800;font-size:14.5px;text-align:center;pointer-events:none;opacity:0;transition:opacity .35s;line-height:1.3;box-shadow:0 4px 0 rgba(0,0,0,.3)}
#tip.on{opacity:1}
#respawn{position:absolute;left:0;right:0;top:40%;z-index:5;text-align:center;font-weight:900;font-size:26px;pointer-events:none;display:none;
  text-shadow:0 3px 0 #000,0 0 12px rgba(0,0,0,.7)}
#respawn.on{display:block}
#respawn small{display:block;font-size:40px;color:#ffe066}
#sheet{position:absolute;left:8px;right:8px;bottom:calc(var(--ad-h) + max(10px,env(safe-area-inset-bottom)));z-index:6;background:linear-gradient(#2f4a2a,#1b2c18);
  border:3px solid #7fe3ff;border-radius:20px;padding:10px;box-shadow:0 8px 0 rgba(0,0,0,.35);transform:translateY(130%);transition:transform .25s}
#sheet.on{transform:none}
.sh-title{text-align:center;font-weight:900;font-size:18px;color:#bff3ff;margin-bottom:8px;display:flex;justify-content:center;gap:10px;align-items:center}
.sh-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sh-btn{border:none;border-radius:14px;min-height:64px;color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;padding:6px 10px;text-align:left;
  background:linear-gradient(#79c83f,#3f8a22);box-shadow:0 4px 0 #22521a}
.sh-btn svg{width:30px;height:30px;flex:none}
.sh-btn span{flex:1;min-width:0;line-height:1.2}
.sh-btn small{display:block;font-size:11.5px;opacity:.85}
.sh-btn em{font-style:normal;display:flex;align-items:center;gap:3px;background:rgba(0,0,0,.3);border-radius:10px;padding:2px 7px;font-size:13px}
.sh-btn em .coin{width:13px;height:13px}
.sh-btn em .coin::after{display:none}
.sh-btn.no{filter:saturate(.3) brightness(.75)}
.sh-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #22521a}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud" class="hid">
    <div class="row">
      <button class="ibtn" id="btn-pause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="#fff"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="#fff"/></svg></button>
      <div class="lvbox">
        <div class="lvtxt"><span id="h-stage">Stage 1</span><span id="h-area">Area 1/4</span></div>
        <div class="corebar" id="h-corebox"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10H3z" fill="#7fd0ff" stroke="#0d3b57" stroke-width="1.6" stroke-linejoin="round"/><rect x="9.5" y="14" width="5" height="7" fill="#0d3b57"/></svg><div class="bar"><i id="h-core"></i></div><b id="h-coretxt">-</b></div>
      </div>
      <div class="coinpill" id="coinpill"><i class="coin"></i><span id="h-coins">0</span></div>
    </div>
    <div class="row c"><div class="pill" id="h-horde"></div></div>
  </div>
  <div id="ad-slot" aria-hidden="true" hidden></div>

  <div id="title">
    <button class="ibtn tgear" id="btn-gear" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="3.2 2.1"/><circle cx="12" cy="12" r="6" fill="#fff"/><circle cx="12" cy="12" r="2.4" fill="#1d3a1b"/></svg></button>
    <canvas id="logo"></canvas>
    <div class="sub" data-t="Zombie Defense">Zombie Defense</div>
    <div class="tbot" id="tbot">
      <div class="info">
        <div class="chip" id="t-level">Stage 1</div>
        <div class="chip" id="t-best">Best: -</div>
        <div class="chip"><i class="coin"></i><span id="t-coins">0</span></div>
      </div>
      <button class="btn big" id="btn-play"><span data-t="PLAY">PLAY</span><small id="t-play-sub"></small></button>
      <div class="brow"><button class="btn gray" id="btn-settings" data-t="Settings">Settings</button></div>
    </div>
  </div>

  <div id="banner"></div>
  <div id="tip"></div>
  <div id="respawn"><span data-t="Respawning...">Respawning...</span><small id="respawn-n">3</small></div>
  <div id="toast"></div>
  <div id="sheet"><div class="sh-title"><span data-t="Hero upgrades">Hero upgrades</span><div class="coinpill" style="font-size:14px;min-width:0;padding:2px 10px 2px 4px"><i class="coin" style="width:16px;height:16px"></i><span id="sh-coins">0</span></div></div><div class="sh-grid" id="sh-grid"></div></div>

  <div class="ov" id="ov-settings"><div class="card">
    <h2 data-t="Settings">Settings</h2>
    <div class="set-row"><span data-t="Language">Language</span><div class="seg" id="seg-lang"><button data-l="en">English</button><button data-l="th">ไทย</button></div></div>
    <div class="set-row"><span data-t="Sound effects">Sound effects</span><div class="seg"><button id="tog-sfx">On</button></div></div>
    <div class="set-row vol"><div class="lab"><span data-t="Music volume">Music volume</span><b id="mus-val">50</b></div><input type="range" id="mus" min="0" max="100" step="5" value="50"/></div>
    <ol class="howto"><li data-t="h1">-</li><li data-t="h2">-</li><li data-t="h3">-</li><li data-t="h4">-</li></ol>
    <button class="btn green" id="set-close" data-t="Close">Close</button>
    <div class="ver" id="ver">v2.0.0</div>
  </div></div>

  <div class="ov" id="ov-pause"><div class="card">
    <h2 data-t="Paused">Paused</h2>
    <button class="btn green" id="p-resume" data-t="Resume">Resume</button>
    <button class="btn gray" id="p-settings" data-t="Settings">Settings</button>
    <button class="btn gray" id="p-menu" data-t="Main menu">Main menu</button>
  </div></div>

  <div class="ov" id="ov-win"><div class="card">
    <h2 id="w-title">Stage 1 cleared!</h2>

    if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.006); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(dest||this.sfxG); o.start(t); o.stop(t+dur+0.03); },
  nz(dur,vol,ft,f0,f1,dest,t0,q){ const c=this.ctx,t=t0||c.currentTime,s=c.createBufferSource(); s.buffer=this.noise; const f=c.createBiquadFilter(); f.type=ft; f.frequency.setValueAtTime(f0,t);

    switch(n){

      case "hit": if(!this.ok(n,0.3)) return; this.osc("sine",95,45,0.2,0.4); this.nz(0.12,0.22,"lowpass",600,120); break;
      case "hurt": if(!this.ok(n,0.3)) return; this.osc("square",220,110,0.12,0.06); this.nz(0.08,0.15,"lowpass",900,200); break;
      case "boss": if(!this.ok(n,0.5)) return; this.osc("sawtooth",120,48,1.1,0.2); this.osc("sawtooth",126,50,1.1,0.16); this.nz(0.9,0.18,"lowpass",500,90); break;

      case "win": if(!this.ok(n,1)) return; [523,659,784,1047,1319].forEach((f,i)=>this.osc("square",f,0,0.18,0.07,null,T+i*0.1)); this.osc("triangle",1047,0,0.6,0.12,null,T+0.5); break;

  musTick(){

    if(settings.music<=0){ this.mus.next=c.currentTime+0.1; return; }

  },
  musNote(s,tm){
    const D=this.musG, pos=s%16, bar=Math.floor(s/16)%8, mf=m=>440*Math.pow(2,(m-69)/12);

    if(pos%4===0) this.osc("sine",150,42,0.18,0.5,D,tm);
    if(pos===4||pos===12) this.nz(0.12,0.2,"highpass",1400,0,D,tm);
    if(pos%2===1) this.nz(0.03,0.05,"highpass",7000,0,D,tm);
    if(bar>=4){ const sc=[0,3,5,7,10,12]; if(pos%2===0&&(pos*7+bar*3)%5!==0){ const m=r+12+sc[(pos/2+bar)%6]; this.osc("square",mf(m),0,0.14,0.035,D,tm); } }
  },
  suspend(){ try{ if(this.ctx&&this.ctx.state==="running") this.ctx.suspend(); }catch(e){} },
  resume(){ if(ADS.showing||document.visibilityState==="hidden") return; try{ if(this.ctx&&this.ctx.state==="suspended") this.ctx.resume().catch(()=>{}); }catch(e){} }
};

function updZ(z,dt,play){

    if(z.st==="chase"&&(!ha||h.y>BASE_TOP-10||dist(z.x,z.y,a.x,a.y)>(a.boss?700:520))) z.st="ret";
    if(z.st==="chase"){ tx=h.x; ty=h.y; spd=sp; if(dh<z.r+h.r+4) atk="hero"; }

  z.vx=vx; z.vy=vy; z.x+=vx*dt; z.y+=vy*dt; z.moving=Math.abs(vx)+Math.abs(vy)>4;

  else { if(z.y>BASE_TOP-12&&z.y<BASE_TOP+14) z.x=clamp(z.x,ENT_L+z.r*0.6,ENT_R-z.r*0.6); else if(z.y>=BASE_TOP+14) z.x=clamp(z.x,BASE_L+z.r,BASE_R-z.r); }
  z.x=clamp(z.x,z.r+4,WW-z.r-4);
  if(atk&&play){
    z.atk+=dt; const dmg=z.dps*dt;

    else if(atk==="wall"){ S.wallHP-=dmg; G.wallHitT=0.2; if(S.wallHP<=0){ S.wallHP=0; G.shake=Math.max(G.shake,5); sfx("boom"); for(let i=0;i<10;i++) P(rand(ENT_L,ENT_R),BASE_TOP+26,rand(-60,60),rand(-120,-40),0.7,rand(3,6),"#c8a86a","dirt",0); persistStage(); } }
    else { S.coreHP-=dmg; G.coreHitT=0.25; }
    if(z.atk>0.75){ z.atk=0; if(atk!=="hero") sfx("hit"); const px=atk==="core"?(z.x+CORE.x)/2:z.x, py=atk==="core"?(z.y+CORE.y)/2:z.y+z.r*0.5;
      for(let i=0;i<3;i++) P(px+rand(-8,8),py,rand(-50,50),rand(-90,-30),0.5,rand(2,3.5),atk==="hero"?"#ff5a4a":"#cbb27a","dirt",0); }
  }

    for(let i=0;i<2;i++){ if(G.zs.length>=MAXZ) break; const m=mkZ("walker",Math.pow(1.8,2)*stHP(),Math.pow(1.3,2)*stDPS(),Math.pow(1.8,2)*stCoin()*0.5); m.x=z.x+rand(-50,50); m.y=z.y+rand(20,50); m.anc=z.anc; m.reg=3; m.st="chase"; z.anc.list.push(m); G.zs.push(m);

function separate(){
  const zs=G.zs, n=zs.length, h=G.hero;
  for(let i=0;i<n;i++){ const a=zs[i]; if(a.dead) continue;
    for(let j=i+1;j<n;j++){ const b=zs[j]; if(b.dead) continue; const dx=b.x-a.x, dy=b.y-a.y, md=(a.r+b.r)*0.85; if(dx>md||dx<-md||dy>md||dy<-md) continue;
      const d2=dx*dx+dy*dy; if(d2<md*md&&d2>0.0001){ const d=Math.sqrt(d2), push=(md-d)/d*0.5; a.x-=dx*push; a.y-=dy*push; b.x+=dx*push; b.y+=dy*push; } }
    if(h&&!h.dead){ const dx=a.x-h.x, dy=a.y-h.y, md=a.r+h.r-2, d2=dx*dx+dy*dy; if(d2<md*md&&d2>0.0001){ const d=Math.sqrt(d2); a.x=h.x+dx/d*md; a.y=h.y+dy/d*md; } }
    if(a.wave){ const dx=a.x-CORE.x, dy=a.y-CORE.y, md=CORE.r+a.r, d2=dx*dx+dy*dy; if(d2<md*md&&d2>0.0001){ const d=Math.sqrt(d2); a.x=CORE.x+dx/d*md; a.y=CORE.y+dy/d*md; } }
  }
}

// ===================== UPDATE (fixed 60 Hz) =====================
function compact(a){ let j=0; for(let i=0;i<a.length;i++){ if(!a[i].dead) a[j++]=a[i]; } a.length=j; }
function setTut(n){ if(profile.tut!==n){ profile.tut=n; persist(); tipKey=null; } }
function updTut(dt){
  const tp=profile.tut, h=G.hero;

  else if(tp===1&&G.tutKills>=3) setTut(2);
  else if(tp===2&&profile.coins>=Math.round(15*costMult())) setTut(3);
  else if(tp===3&&built("gun1")){ setTut(4); G.tutT=7; }

function camTarget(){
  let tx, ty;

  else { tx=G.hero.x; ty=G.hero.y-V.h*0.06/V.z; }
  const hw=V.w/2/V.z, hh=V.h/2/V.z;

function update(dt){
  G.time+=dt;
  const play=G.mode==="play";
  if(play){
    updHero(dt); updWaves(dt); updPads(dt); updAnchors(dt); updTut(dt);
    G.saveT-=dt; if(G.saveT<=0){ G.saveT=3; persistStage(); persist(); }
    if(S.coreHP<=0) loseStage();
  } else if(G.mode==="end"){ G.endT-=dt; if(G.endT<=0&&!G.endShown){ G.endShown=true; showEnd(); } }
  for(const z of G.zs){ if(!z.dead) updZ(z,dt,play); }
  separate();
  if(G.mode!=="end"||G.endKind!=="lose") for(const tu of G.turrets) updTurret(tu,dt);
  for(let i=G.bullets.length-1;i>=0;i--){
    const b=G.bullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt; let gone=b.life<=0;
    if(!gone) for(const z of G.zs){ if(z.dead) continue; const dx=z.x-b.x, dy=(z.y-4)-b.y, rr=z.r+4; if(dx*dx+dy*dy<rr*rr){ hurt(z,b.dmg,b.k==="hero"?"hero":"gun");
      for(let k=0;k<3;k++) P(b.x,b.y,rand(-80,80)-b.vx*0.05,rand(-80,80)-b.vy*0.05,rand(.12,.25),1.8,"#fff3a0","spark",0); gone=true; break; } }
    if(gone){ G.bullets[i]=G.bullets[G.bullets.length-1]; G.bullets.pop(); }
  }
  for(let i=G.shells.length-1;i>=0;i--){ const s=G.shells[i]; s.t+=dt/s.dur; const k=Math.min(1,s.t); s.x=s.sx+(s.tx-s.sx)*k; s.y=s.sy+(s.ty-s.sy)*k;
    if(s.t>=1){ G.shells[i]=G.shells[G.shells.length-1]; G.shells.pop(); explode(s.tx,s.ty,s.splash,s.dmg); } }
  compact(G.zs);
  for(let i=G.parts.length-1;i>=0;i--){ const p=G.parts[i]; p.life-=dt; if(p.life<=0){ G.parts[i]=G.parts[G.parts.length-1]; G.parts.pop(); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.size+=p.grow*dt;
    if(p.type==="goo"||p.type==="dirt"||p.type==="shell"){ p.vy+=500*dt; } else if(p.type==="confetti"){ p.vy+=120*dt; p.vx+=Math.sin(G.time*5+p.y)*20*dt; } else if(p.type!=="heal"){ p.vx*=1-2.5*dt; p.vy*=1-2.5*dt; } }
  for(let i=G.nums.length-1;i>=0;i--){ const n=G.nums[i]; n.life-=dt; n.y-=38*dt; if(n.life<=0) G.nums.splice(i,1); }
  const h=G.hero;
  for(let i=G.coins.length-1;i>=0;i--){ const c=G.coins[i]; c.t+=dt;
    if(c.h>0||c.vh>0){ c.vh-=700*dt; c.h+=c.vh*dt; if(c.h<=0){ c.h=0; c.vh=Math.abs(c.vh)>60?-c.vh*0.35:0; } }
    if(c.mag&&h&&!h.dead&&play){
      c.sp=Math.min(1100,c.sp+1800*dt); const dx=h.x-c.x, dy=(h.y-8)-c.y, d=Math.hypot(dx,dy);
      if(d<14){ profile.coins+=c.amt; G.gain=(G.gain||0)+c.amt; G.coins[i]=G.coins[G.coins.length-1]; G.coins.pop(); sfx("coin"); continue; }
      const s=Math.min(d,c.sp*dt); c.x+=dx/d*s; c.y+=dy/d*s;
    } else { c.mag=false; c.x+=c.vx*dt; c.y+=c.vy*dt; c.vx*=1-3*dt; c.vy*=1-3*dt; }
  }
  if(G.gain&&h){ G.gainT=(G.gainT||0)-dt; if(G.gainT<=0){ addNum(h.x+14,h.y-48,"+"+G.gain,"#ffd23f",16); G.gain=0; G.gainT=0.45; bumpCoins(); } }
  for(let i=G.flyC.length-1;i>=0;i--){ const f=G.flyC[i]; f.t+=dt*3.2; if(f.t>=1) G.flyC.splice(i,1); }
  for(let i=G.arcs.length-1;i>=0;i--){ G.arcs[i].life-=dt; if(G.arcs[i].life<=0) G.arcs.splice(i,1); }
  for(let i=G.booms.length-1;i>=0;i--){ G.booms[i].t+=dt; if(G.booms[i].t>0.45) G.booms.splice(i,1); }
  if(G.coreHitT>0) G.coreHitT-=dt; if(G.wallHitT>0) G.wallHitT-=dt;
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*14);

}

const JR=56;
function joyMove(x,y){ let dx=x-joy.bx, dy=y-joy.by; const l=Math.hypot(dx,dy);
  if(l>JR){ joy.bx=x-dx/l*JR; joy.by=y-dy/l*JR; dx=x-joy.bx; dy=y-joy.by; }
  const L=Math.hypot(dx,dy); if(L<5){ joy.dx=joy.dy=0; return; } const m=Math.min(1,L/JR); joy.dx=dx/L*m; joy.dy=dy/L*m; }

  const r=cv.getBoundingClientRect(); joy.on=true; joy.id=e.pointerId; joy.bx=e.clientX-r.left; joy.by=e.clientY-r.top; joy.dx=joy.dy=0;
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  e.preventDefault();
});
cv.addEventListener("pointermove",e=>{ if(!joy.on||e.pointerId!==joy.id) return; const r=cv.getBoundingClientRect(); joyMove(e.clientX-r.left,e.clientY-r.top); });

click("#p-menu",goTitle);
click("#set-close",()=>closeOv("ov-settings"));
click("#w-next",()=>maybeInterstitial(startStage));
click("#w-menu",()=>maybeInterstitial(goTitle));
click("#l-retry",()=>maybeInterstitial(startStage));
click("#l-menu",()=>maybeInterstitial(goTitle));
document.querySelectorAll("#seg-lang button").forEach(b=>b.addEventListener("click",()=>{ sfx("click"); LANG=settings.lang=b.dataset.l; persistSettings(); applyLang(); }));
click("#tog-sfx",()=>{ settings.sfx=!settings.sfx; persistSettings(); applyLang(); });
const mus=$("#mus");
function musUI(){ mus.value=settings.music; mus.style.setProperty("--p",settings.music+"%"); $("#mus-val").textContent=settings.music; }
mus.addEventListener("input",()=>{ settings.music=clamp(Number(mus.value)||0,0,100); musUI(); audio.ensure(); audio.setMusic(); audio.musicStart(); persistSettings(); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"){ pause(); persist(); if(S) persistStage(); audio.suspend(); } else audio.resume(); });
window.addEventListener("pagehide",()=>{ persist(); if(S) persistStage(); });
window.addEventListener("resize",()=>{ clearTimeout(window.__rz); window.__rz=setTimeout(resize,120); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(!handleBack()) goTitle(); return; } const k=e.key.toLowerCase(); if(k.length===1||k.startsWith("arrow")){ keys[k]=true; if(k.startsWith("arrow")) e.preventDefault(); } });
document.addEventListener("keyup",e=>{ keys[e.key.toLowerCase()]=false; });
window.addEventListener("blur",()=>{ for(const k in keys) keys[k]=false; });
document.addEventListener("contextmenu",e=>e.preventDefault());

// ===================== MAIN LOOP =====================
let lastT=performance.now(), acc=0; const STEP=1/60;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(0.1,Math.max(0,(ts-lastT)/1000)); lastT=ts;
  if(G.mode!=="pause"){ acc+=dt; let n=0; while(acc>=STEP&&n<8){ update(STEP); acc-=STEP; n++; } if(n>=8) acc=0; }
  render(); updHud();
}
// Test/automation hook (used by headless tests). Harmless in production.
window.TT={G,get S(){ return S; },profile,joy,V,pathX,BASE_TOP,CORE,ENT_L,ENT_R,
  sim(sec){ const n=Math.round(sec*60); for(let i=0;i<n;i++){ if(G.mode==="pause") break; update(STEP); } render(); updHud(); return G.mode; },
  setJoy(dx,dy){ const l=Math.hypot(dx,dy)||1, m=Math.min(1,l); joy.dx=dx/l*m; joy.dy=dy/l*m; },
  pads:()=>(G.pads||[]).map(p=>({key:p.key,x:p.x,y:p.y,cost:p.cost,paid:S.paid[p.key]||0,act:p.act})),
  start:()=>startStage(), title:()=>goTitle()};

$("#ver").textContent="Turret Tide v"+VERSION;
musUI(); loadStage(); resize(); applyLang(); goTitle();
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(drawLogo).catch(()=>{});
})();
</script>
</body>
</html>
